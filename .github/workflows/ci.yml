name: CI

on:
  push:
    branches: [main, refactoring]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The library is developed alongside these tools. Prefer a branch of the
      # same name so a cross-repository change is tested as one unit, and fall
      # back to the default branch.
      - name: Check out the fahapi library next to this repository
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          repo=https://github.com/guckykv/freeathome-go-fahapi.git
          git clone --depth 1 --branch "$branch" "$repo" ../freeathome-go-fahapi \
            || git clone --depth 1 "$repo" ../freeathome-go-fahapi
          go work init . ../freeathome-go-fahapi

      # Same targets you run locally, so CI cannot drift from the Makefile.
      - run: make check
      - run: make check-noworkspace
